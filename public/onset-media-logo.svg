<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Dark cinematic backdrop gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>
    
    <!-- Warm Logo Mark Glow -->
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Warm Text Glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="600" height="500" fill="url(#bgGlow)" rx="16" />

  <!-- Subtle curved golden horizon glow at base -->
  <ellipse cx="300" cy="510" rx="340" ry="120" fill="#FFB800" opacity="0.16" />
  <path d="M 40 480 Q 300 440 560 480" fill="none" stroke="#F5C518" stroke-width="1.8" opacity="0.6" />

  <!-- Centered Brand Lockup matching the reference video -->
  <g transform="translate(300, 190)">
    <!-- Stylized Geometric Mark: Vertical stem, left wing with rounded tip, circular loop with inner hole -->
    <g filter="url(#markGlow)">
      <path d="
        M 33 -26
        L 33 -86
        L 5 -86
        L 5 -26
        L -75 -26
        A 14 14 0 0 0 -75 2
        L -15.5 2
        A 56 56 0 1 0 33 -26
        Z
        M 33 2
        A 28 28 0 1 0 33 58
        A 28 28 0 1 0 33 2
        Z
      " fill="#FFFFFF" fill-rule="evenodd" />

      <!-- Warm golden rim lighting on lower curve of loop -->
      <path d="M 5 30 A 28 28 0 0 0 33 58 A 56 56 0 0 0 89 30" fill="none" stroke="#F5C518" stroke-width="3.5" opacity="0.85" />
    </g>

    <!-- "Onset Media" in prestige radiant gold -->
    <text x="0" y="152" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFC837" letter-spacing="-0.5" filter="url(#textGlow)">
      Onset Media
    </text>

    <!-- "Production House" in elegant clean white -->
    <text x="0" y="190" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" letter-spacing="3" opacity="0.95">
      Production House
    </text>
  </g>
</svg>
